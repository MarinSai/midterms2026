<script>
// Défilement compatible iframe : dans une iframe redimensionnée par iframe-resizer, c’est la page parente qui défile
// (Safari ne propage pas scrollIntoView d’une iframe d’un autre domaine vers la page qui l’accueille).
// Typographie appliquée au texte affiché : espaces insécables (français), apostrophe typographique, initiales espacées, titres en italique
window.__typo = function (root) {
  if (!root) return;
  const fr = (document.documentElement.lang || 'fr').startsWith('fr');
  const TIT = /((?:The )?New York Times|Cook Political Report|2026 Poll Hours Report)/;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), list = [];
  while (w.nextNode()) list.push(w.currentNode);
  for (const n of list) {
    const p = n.parentNode; if (!p || p.nodeName === 'SCRIPT' || p.nodeName === 'STYLE' || p.nodeName === 'I') continue;
    let t = n.nodeValue, o = t;
    t = t.replace(/(\w)'(\w)/g, '$1’$2').replace(/\b([A-Z])\.([A-Z])\./g, '$1. $2.');
    if (fr) t = t.replace(/ ([;!?])/g, ' $1').replace(/ :/g, ' :').replace(/« /g, '« ').replace(/ »/g, ' »');
    if (t !== o) n.nodeValue = t;
    if (TIT.test(t) && p.closest && !p.closest('i')) {
      const f = document.createDocumentFragment();
      for (const part of t.split(TIT)) { if (!part) continue; if (TIT.test(part)) { const i = document.createElement('i'); i.textContent = part; f.appendChild(i); } else f.appendChild(document.createTextNode(part)); }
      p.replaceChild(f, n);
    }
  }
};
window.__gcScroll = function (el, block) {
  if (!el) return;
  const p = window.parentIframe || window.parentIFrame;
  if (p && window.top !== window.self && typeof p.scrollToOffset === 'function') {
    try { p.scrollToOffset(0, Math.max(0, el.getBoundingClientRect().top + window.scrollY - 12)); return; } catch (e) {}
  }
  try { el.scrollIntoView({ behavior: 'smooth', block: block || 'start' }); } catch (e) { el.scrollIntoView(); }
};
</script>

  /*__BLOBS__*/
  const realFetch = window.fetch.bind(window);

  window.fetch = (u, o) => (/*__CHAMBER__*/'S' === 'H' && typeof u === 'string' && BLOBS[u] && /senat-geo/.test(BLOBS[u])) ? Promise.reject(new Error('inutile')) : realFetch(typeof u === 'string' && BLOBS[u] ? BLOBS[u] : u, o);
  const comp = new Component(props);
  let handlers = {};

  const popHtml = (v) => {

    if (v.hasSel) {
      const s = v.sel;
      pop = '<div class="pop" role="dialog" aria-label="' + esc(s.name) + '" style="' + v.popStyle + '">' + popHead(s.kicker, s.name)
        + '<div><div class="prow mono" style="padding-top:0;padding-bottom:4px;font-family:\'GC National\',\'Helvetica Neue\',sans-serif;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#1c1b1c;border-bottom:1px solid #efedea"><span>Candidat</span><span>Parti</span><span style="text-align:right">' + (window.__isRes ? '%' : 'Sondages') + '</span></div>'
        + s.cands.map((c) => '<div class="prow" style="border-bottom:1px solid #efedea;' + c.rowStyle + '"><span style="font-weight:600;line-height:1.2">' + esc(c.check + c.n + c.star) + '</span><span style="font-size:12px;opacity:.85">' + c.ps + '</span><span class="mono" style="text-align:right;font-weight:600">' + c.pn + '</span></div>').join('') + '</div>'
        + (s.hasPoll ? '<div style="display:flex;flex-direction:column;gap:5px"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px"><span>Écart - <b>' + esc(s.gapText) + '</b></span><span class="mono" style="font-size:10px;letter-spacing:.04em;white-space:nowrap;' + s.moeStyle + '">' + esc(s.moeText) + '</span></div>'
          + '<div aria-hidden="true" style="position:relative;height:14px;border-radius:999px;background:#f0eeea"><span style="position:absolute;top:0;bottom:0;border-radius:999px;' + s.bandStyle + '"></span><span style="position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:#8c8a85"></span><span style="position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:#141414;' + s.tickStyle + '"></span></div>'
          + '<div class="mono" style="display:flex;justify-content:space-between;font-size:10px;letter-spacing:.04em"><span style="' + s.endAStyle + '">← ' + esc(s.endA) + '</span><span style="color:#6b6965">0</span><span style="' + s.endBStyle + '">' + esc(s.endB) + ' →</span></div>'
          + '<span style="font-size:11.5px;line-height:1.35;color:#6b6965;">' + esc(s.moeNote) + '</span></div>' : '')

        + '</div>';
    } else if (v.hasStateSel) {

      pop = '<div class="pop" role="dialog" aria-label="' + esc(s.name) + '" style="' + v.popStyle + '">' + popHead(s.kicker, s.name)
        + '<div class="mono" style="display:flex;gap:14px;font-size:11.5px"><span style="color:#1f6fc4">Dém. ' + s.d + '</span><span style="color:#c62f3f">Rép. ' + s.r + '</span><span style="color:#6b6965">' + (window.__isRes ? 'Non tranché ' : 'Indécis ') + s.u + '</span></div>'
        + '<div style="max-height:210px;overflow-y:auto">' + s.rows.map((w) => '<button class="row mono" data-h="' + h(w.pick) + '" aria-label="' + esc(w.aria) + '" style="width:100%;display:flex;justify-content:space-between;gap:8px;padding:7px 4px;border-bottom:1px solid #efedea;font-size:11.5px;text-align:left;box-sizing:border-box"><span style="font-weight:600">' + esc(w.name + w.gainMark) + '</span><span style="color:' + w.statusColor + '">' + esc(w.status) + '</span></button>').join('') + '</div></div>';
    }

    return pop;
  };
  const CH = /*__CHAMBER__*/'S';
  const TEXT = { D: '#1f6fc4', R: '#c62f3f', I: '#8a6200' }, TOSS = '#b49ce0', OFF = '#eceae6';
  const pty = { D: 'Dém.', R: 'Rép.', I: 'Ind.' };
  const surname = (n) => { const w = n.replace(/,?\s+(Jr\.?|Sr\.?|II|III|IV)$/, '').split(' '); let i = w.length - 1; while (i > 0 && /^(de|De|del|Del|La|la|Le|le|Van|van|Von|von|der|Der|da|Da|di|Di)$/.test(w[i - 1])) i--; return w.slice(i).join(' '); };
  const fmt = (x) => (Math.round(x * 10) / 10).toFixed(1).replace('.', ',');
  // courses indécises (Cook) et sondages
  const tossList = () => {
    const PL = comp.polls(), NAMES = comp.names(), out = [];
    const mk = (key, name, holder, base) => {
      const p = PL[key], row = { key, name, holder, poll: null };
      if (p && p.c.length > 1) {
        const c = p.c.slice().sort((a, b) => b[2] - a[2]), a = c[0], b = c[1];
        const full = (nm) => base.find((x) => x[0].toLowerCase().endsWith(nm.toLowerCase())) || [nm, '', 0];
        const cand = (x) => { const f = full(x[0]); return { n: surname(f[0]), p: x[1], v: x[2], inc: !!f[2] }; };

    else { const HD = comp.houseData(); for (const id in HD) if (HD[id][1] === 3) mk('H:' + id, id.replace('-AL', ' (circonscription unique)'), HD[id][0], HD[id][2]); }
    return out.sort((x, y) => y.sort - x.sort);
  };
  window.__render = function () {
    const mob = window.matchMedia('(max-width: 600px)').matches;
    handlers = {};

    const pop = popHtml(v);

      const SC = comp.cookSenate(), R = comp.races();

    } else if (CH === 'H' && v.cells.length) {

      map = '<div class="wrap" style="--a:' + v.hAspect + '">'
        + v.cells.map((c, i) => { const id = hc[i].id, toss = HD[id][1] === 3;

              : '<span class="cell" aria-hidden="true" style="' + c.style.replace(/background: [^;]+;/, 'background: ' + OFF + ';') + '"></span>'; }).join('')
        + '<svg aria-hidden="true" viewBox="' + v.hView + '" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4"><path d="' + v.hOutline + '" fill="none" stroke="#141414" stroke-width="1.3" vector-effect="non-scaling-stroke" stroke-linejoin="round"></path></svg>'
        + v.hLabels.filter((l) => tossSt.has(l.t)).map((l) => '<span class="hlbl" style="' + l.style + '">' + l.t + '</span>').join('')
        + (mob ? '' : pop) + '</div>';
    }
    // panneau récapitulatif
    const sel = comp.state.sel;
    const big = (n, l, c) => '<div style="display:flex;flex-direction:column;gap:2px"><span style="font-family:\'GC Sanomat\',Georgia,serif;font-weight:600;font-size:30px;line-height:1;font-variant-numeric:lining-nums tabular-nums;color:' + c + '">' + n + '</span><span class="mono" style="font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#1c1b1c">' + l + '</span></div>';
    const rows = list.map((r) => {
      const p = r.poll, on = sel === r.key;
      const lead = p ? (p.gap === 0 ? '<span style="color:#6b4fa8;font-weight:600">Égalité</span>' : '<span style="color:' + (TEXT[p.a.p] || '#6b6965') + ';font-weight:600">' + esc(p.a.n) + ' +' + fmt(p.gap) + '</span>') : '<span style="color:#6b6965">Pas de moyenne</span>';
      const sub = p ? esc(p.a.n + (p.a.inc ? '*' : '')) + ' (' + (pty[p.a.p] || 'Autre') + ') ' + fmt(p.a.v) + ' % - ' + esc(p.b.n + (p.b.inc ? '*' : '')) + ' (' + (pty[p.b.p] || 'Autre') + ') ' + fmt(p.b.v) + ' %' : '';
      const leadH = p ? (p.gap === 0 ? '<span style="color:#6b4fa8;font-weight:600">Égalité</span>' : '<span style="color:' + (TEXT[p.a.p] || '#6b6965') + ';font-weight:600">' + (pty[p.a.p] || 'Autre') + ' +' + fmt(p.gap) + '</span>') : '<span style="color:#6b6965">—</span>';
      if (CH === 'H') return '<button class="trow hrow" data-h="' + h(() => comp.setState({ sel: on ? null : r.key })) + '" aria-pressed="' + on + '" aria-label="' + esc(r.name + ', ' + (r.holder === 'D' ? 'siège démocrate' : 'siège républicain')) + '" style="' + (on ? 'background:#f1eff9;' : '') + '"><span class="tl1"><span class="hd" style="background:' + (r.holder === 'D' ? '#3b8ee6' : r.holder === 'R' ? '#e85462' : '#f0b53a') + '"></span><span style="font-weight:600">' + esc(r.name) + '</span><span style="margin-left:auto;white-space:nowrap;font-size:12px">' + leadH + '</span></span></button>';
      return '<button class="trow" data-h="' + h(() => comp.setState({ sel: on ? null : r.key })) + '" aria-pressed="' + on + '" style="' + (on ? 'background:#f1eff9;' : '') + '"><span class="tl1"><span style="font-weight:600">' + esc(r.name) + '</span><span class="tsub">' + (r.holder === 'D' ? 'siège dém.' : r.holder === 'R' ? 'siège rép.' : 'siège ind.') + '</span><span style="margin-left:auto;white-space:nowrap">' + lead + '</span></span>' + (sub ? '<span class="tsub">' + sub + '</span>' : '') + '</button>';
    }).join('');
    const panel = '<aside class="tpanel" aria-label="Récapitulatif des courses indécises">'
      + '<span class="mono" style="font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#1c1b1c">' + (CH === 'S' ? 'Sénat' : 'Chambre des représentants') + '</span>'
      + '<div style="display:flex;gap:18px;align-items:flex-end">' + big(v.dTotal, 'Démocrates', '#3b8ee6') + big(list.length, 'Indécis', '#8a6fd0') + big(v.rTotal, 'Républicains', '#e85462') + '</div>'
      + '<span style="font-size:12.5px;line-height:1.4;color:#3a3936">' + (CH === 'S' ? 'Majorité : 51 sièges (50 pour les républicains, grâce à la voix du vice-président). Sièges hors scrutin compris.' : 'Majorité : 218 sièges.') + '</span>'
      + '<span class="mono" style="font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#1c1b1c;margin-top:4px">' + (CH === 'S' ? list.length + ' courses indécises' : list.length + ' circonscriptions indécises') + '</span>'
      + '<div class="trows' + (CH === 'H' ? ' hgrid' : '') + '">' + rows + '</div>' + (CH === 'H' ? '<span class="tsub" style="display:flex;gap:12px"><span><span class="hd" style="background:#3b8ee6"></span> siège démocrate</span><span><span class="hd" style="background:#e85462"></span> siège républicain</span></span><span class="tsub">En tête dans les sondages et écart en points ; — : pas de moyenne.</span>' : '')
      + '<span style="font-size:11px;line-height:1.4;color:#6b6965">Classements : Cook Political Report, 30 octobre 2026. Sondages : moyennes Silver Bulletin, 29 octobre 2026 (écart en points). Graphique : Le Grand Continent.</span>'
      + '</aside>';
    document.getElementById('app').innerHTML = '<div class="tframe"><div class="tmap">' + map + '</div>' + panel + '</div>' + (mob && pop ? '<div class="popm sheet">' + pop + '</div>' : '');
    window.__typo(document.getElementById('app'));
    const pd = !mob && document.querySelector('.wrap .pop');
    if (pd) { const bx = pd.closest('.wrap').getBoundingClientRect(), r = pd.getBoundingClientRect(); let dx = 0, dy = 0;
      if (r.right > bx.right) dx = bx.right - r.right; if (r.left + dx < bx.left) dx = bx.left - r.left;
      const vh = window.innerHeight; if (r.bottom > vh - 4) dy = vh - 4 - r.bottom; if (r.top + dy < 4) dy = 4 - r.top;
      if (dx || dy) pd.style.translate = Math.round(dx) + 'px ' + Math.round(dy) + 'px'; }
  };
  document.getElementById('app').addEventListener('click', (e) => {
    const b = e.target.closest('[data-h]');
    if (!b || b.dataset.off || !handlers[b.getAttribute('data-h')]) { if (comp.state.sel && !e.target.closest('.pop, .popm')) comp.setState({ sel: null }); return; }
    const fn = handlers[b.getAttribute('data-h')]; if (fn) fn();
  });
  window.addEventListener('resize', () => window.__render());
  window.__render();
  comp.componentDidMount();
})();
</script>
</body>
</html>
