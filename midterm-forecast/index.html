    const finalMargin = margin + (rnd() - .5) * 7;
    let eevp;
    if (scenario === 'Avant le scrutin') eevp = 0;
    else if (scenario === 'Résultats définitifs') eevp = rnd() < .2 ? 96 + Math.floor(rnd() * 4) : 100;
    else {

  // Écart entre les deux premiers et marge d'erreur indicative : erreur moyenne, sur l'écart, de la moyenne simple des sondages
  // des 21 derniers jours (courses avec au moins 3 sondages, 1998-2024), calculée d'après la base brute Silver Bulletin (avril 2026) :
  // Sénat 4,05 pts (309 courses), Chambre 4,43 pts (157 courses)
  pollGap(lead, sec, SOLID, TINT, TEXT, senate) {
    if (!lead || !sec) return { hasPoll: false };
    const MOE = senate ? 4.1 : 4.4, r1 = (x) => Math.round(x * 10) / 10;
    const last = (n) => n.split(' ').slice(-1)[0];
    // D à gauche, R à droite ; sinon le premier à gauche
    let A = lead, B = sec;
    if (B.p === 'D' && A.p !== 'D') { A = sec; B = lead; }
    else if (A.p === 'R' && B.p !== 'R') { A = sec; B = lead; }
    const m = r1(r1(A.avg) - r1(B.avg));
    const gap = r1(r1(lead.avg) - r1(sec.avg));
    const S = Math.max(20, Math.ceil((Math.abs(m) + MOE) / 5) * 5);
    const pos = (x) => 50 - x / S * 50;
    const inMoe = gap < MOE;
    return {
      hasPoll: true,
      gapText: last(lead.n) + ' +' + gap.toFixed(1).replace('.', ',') + ' pts',
      moeText: inMoe ? 'Dans la marge d’erreur' : 'Au-delà de la marge',
      moeStyle: 'color: ' + (inMoe ? '#6b4fa8' : (TEXT[lead.p] || '#6b6965')) + ';',
      bandStyle: 'left: ' + pos(m + MOE).toFixed(2) + '%; width: ' + (MOE / S * 100).toFixed(2) + '%; background: ' + (TINT[lead.p] || '#e4e2de') + '; box-shadow: inset 0 0 0 1px ' + (SOLID[lead.p] || '#8c8a85') + ';',
      tickStyle: 'left: ' + pos(m).toFixed(2) + '%;',
      endA: last(A.n), endB: last(B.n),
      moeNote: 'Bande : ±' + MOE.toFixed(1).replace('.', ',') + ' pts, l’écart moyen entre les moyennes de sondages et le résultat ' + (senate ? 'au Sénat' : 'à la Chambre') + ' depuis 1998 (calcul Le Grand Continent, d’après Silver Bulletin).',
      endAStyle: 'color: ' + (TEXT[A.p] || '#6b6965') + ';', endBStyle: 'color: ' + (TEXT[B.p] || '#6b6965') + ';'
    };
  }

  // Hémicycle : rangées concentriques ; chaque parti occupe un secteur aux bords droits, séparé de l’autre par un couloir.
  // Dans chaque rangée, les sièges d’un parti sont répartis régulièrement, du sol jusqu’au bord du couloir.
  hemiLayout(n, rows, d, maj, W, top) {
    const key = [n, rows, d, maj, W, top].join(':'); this._hl = this._hl || {};
    if (this._hl[key]) return this._hl[key];
    const r0 = 0.5, radii = [], per = [];
    for (let i = 0; i < rows; i++) radii.push(r0 + (1 - r0) * i / (rows - 1));
    const sr = radii.reduce((a, b) => a + b, 0);
    // sièges par rangée, proportionnels au rayon (plus grands restes)
    let raw = radii.map((r) => n * r / sr), fl = raw.map(Math.floor), left = n - fl.reduce((a, b) => a + b, 0);
    raw.map((x, i) => [x - fl[i], i]).sort((a, b) => b[0] - a[0]).slice(0, left).forEach(([, i]) => { fl[i]++; });
    per.push(...fl);
    // sièges démocrates par rangée, dans la même proportion partout (plus grands restes)
    let rd = per.map((k) => k * d / n), fd = rd.map(Math.floor), ld = d - fd.reduce((a, b) => a + b, 0);
    rd.map((x, i) => [x - fd[i], i]).sort((a, b) => b[0] - a[0]).slice(0, ld).forEach(([, i]) => { fd[i]++; });
    const step = Math.min((1 - r0) / (rows - 1), ...radii.map((r, i) => Math.PI * r / Math.max(1, per[i] - 1)));
    const dot = step * 0.4, G = step * 1.15, pad = dot * 1.75;
    const k = (W / 2) / (1 + pad + dot * 0.2), cx = W / 2, cy = top + k * (1 + pad);
    const theta = Math.PI * (1 - d / n);            // bord commun des deux secteurs
    const P = (r, a) => [cx + r * Math.cos(a) * k, cy - r * Math.sin(a) * k];
    const dots = [];
    radii.forEach((r, i) => {
      const nd = fd[i], nr = per[i] - nd, g = G / r;
      const place = (cnt, a0, a1, fill) => { for (let j = 0; j < cnt; j++) { const a = cnt === 1 ? a0 : a0 + (a1 - a0) * j / (cnt - 1); const [x, y] = P(r, a); dots.push({ cx: x.toFixed(1), cy: y.toFixed(1), r: (dot * k).toFixed(2), fill }); } };
      if (d > 0 && d < n) { place(nd, Math.PI, theta + g, '#3b8ee6'); place(nr, theta - g, 0, '#e85462'); }
      else place(per[i], Math.PI, 0, d >= n ? '#3b8ee6' : '#e85462');
    });
    // contour du bloc majoritaire (secteur de couronne, coins arrondis)
    let block = '';
    const dMaj = d >= maj;
    if (d > 0 && d < n) {
      const Ro = 1 + pad, Ri = r0 - pad, e = (G - pad), ext = pad;
      const a0o = dMaj ? Math.PI + ext / Ro : theta - e / Ro, a1o = dMaj ? theta + e / Ro : -ext / Ro;
      const a0i = dMaj ? theta + e / Ri : -ext / Ri, a1i = dMaj ? Math.PI + ext / Ri : theta - e / Ri;
      const c = pad * 0.9;                           // rayon des coins
      const arcPts = (R, a0, a1, m) => { const o = []; for (let j = 0; j <= m; j++) o.push(P(R, a0 + (a1 - a0) * j / m)); return o; };
      const so = c / Ro, si = c / Ri;
      const outer = arcPts(Ro, a0o + Math.sign(a1o - a0o) * so, a1o - Math.sign(a1o - a0o) * so, 64);
      const inner = arcPts(Ri, a0i + Math.sign(a1i - a0i) * si, a1i - Math.sign(a1i - a0i) * si, 40);
      const cO0 = P(Ro, a0o), cO1 = P(Ro, a1o), cI0 = P(Ri, a0i), cI1 = P(Ri, a1i);
      const f = (p) => p[0].toFixed(1) + ' ' + p[1].toFixed(1);
      // le long de chaque bord droit, on s’arrête à c du coin
      const toward = (p, q, dd) => { const L = Math.hypot(q[0] - p[0], q[1] - p[1]) || 1; return [p[0] + (q[0] - p[0]) * dd / L, p[1] + (q[1] - p[1]) * dd / L]; };
      const ck = c * k;
      block = 'M' + f(outer[0]) + outer.slice(1).map((p) => 'L' + f(p)).join('')
        + 'Q' + f(cO1) + ' ' + f(toward(cO1, cI0, ck))
        + 'L' + f(toward(cI0, cO1, ck)) + 'Q' + f(cI0) + ' ' + f(inner[0])
        + inner.slice(1).map((p) => 'L' + f(p)).join('')
        + 'Q' + f(cI1) + ' ' + f(toward(cI1, cO0, ck))
        + 'L' + f(toward(cO0, cI1, ck)) + 'Q' + f(cO0) + ' ' + f(outer[0]) + 'Z';
    }
    // repère de majorité : au seuil, sur le bord extérieur
    const am = Math.PI * (1 - maj / n), tp = P(1 + pad, dMaj ? am : am);
    const out = { dots, block, tx: tp[0].toFixed(1), ty: (tp[1] - 2).toFixed(1), lx: Math.min(W - 70, Math.max(70, tp[0])).toFixed(1), hy: cy };
    return (this._hl[key] = out);
  }

    const pct = (n) => n / total * 100;
    const pills = [];
    const seatBg = new Array(total).fill('#e4e2de'), seatT = new Array(total).fill('Siège non attribué');
    const put = (from, n, bg, title) => { for (let i = from; i < from + n && i < total; i++) { seatBg[i] = bg; seatT[i] = title; } };

    if (rBase) put(x, rBase, hatch(SOLID.R), rBase + ' sièges républicains hors scrutin');
// Un carré par siège, rangés par colonnes (2 rangées pour le Sénat, 5 pour la Chambre)
    const ROWS = isSenate ? 2 : 5, COLS = Math.ceil(total / ROWS), FILL = isSenate ? .86 : .8;
    for (let i = 0; i < total; i++) {
      const c = Math.floor(i / ROWS), r = i % ROWS;
      pills.push({ title: seatT[i], style: 'left: ' + (c / COLS * 100) + '%; top: ' + (r / ROWS * 100) + '%; width: ' + (100 / COLS * FILL) + '%; height: ' + (100 / ROWS * FILL) + '%; border-radius: 2px; background: ' + seatBg[i] + ';' });
    }

    const mPct = (isSenate ? 25 : markAt / ROWS) / COLS * 100 - (1 - FILL) * 50 / COLS;

    // ---------- Carte du Sénat ----------
    const geo = this.state.geo;
    const sFill = (st) => sRes[st] ? fillOf(sRes[st]) : 'url(#noel)';
    const sTxt = (st) => sRes[st] ? txtOf(sRes[st]) : '#141414';
    const SMALL = { NH: 1, MA: 1, RI: 1, NJ: 1, DE: 1 };
    const NUDGE = { MI: [14, 22], FL: [22, 8], LA: [-12, -4], KY: [8, 3], ID: [0, 22], MN: [-6, 4], WV: [-4, 4], VA: [10, 2], NC: [6, 0], SC: [4, 2], ME: [2, 0] };
    const states = [], labels = [], miniS = [];

    const CO_Y = { NH: 150, MA: 182, RI: 214, NJ: 262, DE: 300 };
    const callouts = [], coLines = [];
    if (geo && isSenate) for (const st in CO_Y) {

      callouts.push({ t: st, gain: sGain(st), dot: sTxt(st), aria: NAMES[st] + ' : voir les résultats', pick: pickSel('S:' + st), style: 'left: ' + (930 / 9.75) + '%; top: ' + (yy / 6.1) + '%; background: ' + sFill(st) + '; color: ' + sTxt(st) + ';' + (sel === 'S:' + st ? ' box-shadow: 0 0 0 2px #141414;' : '') });

    // ---------- Carte de la Chambre ----------

    if (house) {

          style: box + ' background: ' + f + ';' + (house.hex ? ' transform: scale(.955);' + (isSel ? ' filter: brightness(.72); z-index: 3;' : '') : ' border: 1.5px solid #ffffff;' + (isSel ? ' box-shadow: inset 0 0 0 2px #141414; z-index: 3;' : ''))

    }

    const hView = house ? '0 0 ' + house.w * house.unit + ' ' + house.h * house.unit : '0 0 460 270';

    // ---------- Panneau ----------
    const EXTRA = {
      GA: 'Sans majorité absolue, second tour le 1er décembre.',
      AK: 'Vote préférentiel : le décompte final peut prendre plusieurs jours.',
      ME: 'Vote préférentiel en cas d’absence de majorité absolue.',
      NE: 'Pas de candidat démocrate : Dan Osborn, indépendant, est soutenu par les démocrates.',
      ID: 'Pas de candidat démocrate.', SD: 'Pas de candidat démocrate.',
      MT: 'Seth Bodnar, indépendant, est soutenu par l’ancien sénateur démocrate Jon Tester, face à la candidate démocrate Alani Bankhead.',

      OK: 'Alan Armstrong, nommé en mars après le départ de Markwayne Mullin pour le ministère de la Sécurité intérieure, ne peut pas se représenter.'
    };
    const hoursRows = (st) => {
      const h = HOURS[st];
      return [
        { k: h[0] === h[1] ? 'Fermeture des bureaux' : 'Premiers bureaux fermés', v: closeParis(h[0]) },

    };
    const panelFor = (r, holder, st, title, kicker, extra, back) => {
      if (r.status === 'forecast') {

        const lead = p ? r.cands[0] : null, sec = p ? r.cands[1] : null;
        const last = (n) => n.split(' ').slice(-1)[0];
        return {
          name: title, kicker,
          cands: r.cands.map((c, i) => ({
            n: c.n, star: c.inc ? '*' : '', check: '', ps: ({ D: 'Dém.', R: 'Rép.', I: 'Ind.' })[c.p] || 'Div.',
            pn: p ? this.fmtP(c.avg) : '—',
            rowStyle: 'box-shadow: inset 3px 0 0 ' + (SOLID[c.p] || '#8c8a85') + ';'
          })),
          foot: p ? 'Silver Bulletin, 29 oct. · ' + p.n + ' sondages, ' + p.f + ' instituts' : 'Pas de moyenne de sondages (moins de trois sondages)',

        };
      }
      const tot = r.cands.reduce((s, c) => s + c.v, 0);
      const sorted = r.eevp > 0 ? r.cands.slice().sort((a, b) => (a.p === 'O') - (b.p === 'O') || b.v - a.v) : r.cands;

        badgeStyle: r.winner ? 'background: ' + SOLID[r.winner] + '; color: #ffffff;' : (pending ? 'background: #f0eeea; color: #3a3936;' : 'background: #141414; color: #ffffff;'),
        cands: sorted.map((c) => {
          const share = pending || !tot ? 0 : c.v / tot * 100;

            n: c.n, star: c.inc ? '*' : '', check: isW ? '✓ ' : '', p: PNAME[c.p] || 'Divers',
            v: pending ? '—' : this.fmtN(c.v) + ' voix', pct: pending ? '—' : this.fmtP(share),
            text: TEXT[c.p] || '#6b6965',
            ps: ({ D: 'Dém.', R: 'Rép.', I: 'Ind.' })[c.p] || 'Div.',

    let selV = null, stSel = null;
    if (sel && isSenate && sel.startsWith('S:')) {

      selV = panelFor(sRes[st], race[1], st, NAMES[st], (kind ? kind + ' · siège ' : 'Siège ') + (race[1] === 'D' ? 'démocrate' : 'républicain') + ' · ' + statusText(sRes[st]), EXTRA[st], null);
    } else if (sel && !isSenate && sel.startsWith('H:') && hRes[sel.slice(2)]) {

    } else if (sel && !isSenate && sel.startsWith('HS:') && house) {
      const st = sel.slice(3);

      const rows = ids.map((id) => {

      });

    let ax = 50, ay = 30;

    } else if (sel && house && sel.startsWith('H:')) {

    } else if (sel && house && sel.startsWith('HS:') && house.labels[sel.slice(3)]) {
      const l = house.labels[sel.slice(3)]; ax = l[0] / house.w * 100; ay = l[1] / house.h * 100;
    }
    const popStyle = (ax > 55 ? 'right: calc(' + (100 - ax) + '% + 12px);' : 'left: calc(' + ax + '% + 12px);') + (ay > 50 ? ' bottom: calc(' + (100 - ay) + '% - 18px);' : ' top: calc(' + ay + '% - 18px);');

    // ---------- Courses à suivre ----------
    const watchRow = (name, r, a, b, gain, pick, resET) => {

      const last = (n) => n.startsWith('Candidat') ? (n.endsWith('démocrate') ? 'Dém.' : 'Rép.') : n.split(' ').slice(-1)[0];
      const barS = (c, p) => 'flex: 0 0 calc(' + p + '% - 3px); border-radius: 999px; background: ' + (r.winner ? (r.winner === c.p ? SOLID[c.p] : TINT[c.p]) : SOLID[c.p]) + ';' + (p ? '' : ' display: none;');
      return {
        name, gainMark: gain ? ' ●' : '', pick, aria: name + ', ' + statusText(r, resET),
        status: statusText(r, resET), statusColor: r.winner ? TEXT[r.winner] : '#6b6965',
        aStyle: barS(a, pa), bStyle: barS(b, pb),
        a: last(a.n) + (a.inc ? '*' : '') + (r.eevp ? '  ' + this.fmtP(pa) : ''),
        b: (r.eevp ? this.fmtP(pb) + '  ' : '') + last(b.n) + (b.inc ? '*' : '')
      };
    };
    const watch = isSenate
      ? ['OH', 'TX', 'IA', 'KS', 'ME', 'MI', 'AK', 'MN', 'NH', 'NC', 'SC'].map((st) => watchRow(NAMES[st], sRes[st], sRes[st].cands[0], sRes[st].cands[1], sGain(st), pickSel('S:' + st), HOURS[st][2]))
      : (house ? ['IA-02', 'MI-04', 'MI-07', 'MI-10', 'MT-01', 'OH-07', 'OH-09', 'PA-08', 'AZ-01', 'AZ-06', 'CO-08', 'PA-07'].filter((id) => hRes[id]).map((id) => { const st = id.split('-')[0], r = hRes[id]; return watchRow(NAMES[st] + ' · ' + id, r, r.cands[0], r.cands[1], hGain(id), pickSel('H:' + id), HOURS[st][2]); }) : []);

    // ---------- Calendrier ----------
    const NOW_ET = scenario === 'Avant le scrutin' ? 0 : scenario === 'Soirée électorale' ? 25.2 : 99;
    const bySlot = {};
    const slotStates = isSenate ? Object.keys(RACES) : Object.keys(HOURS);
    for (const st of slotStates) { const t = HOURS[st][2]; (bySlot[t] = bySlot[t] || []).push(st); }
    const hByState = {};
    if (house) for (const c of house.cells) (hByState[c.st] = hByState[c.st] || []).push(c.id);
    const slots = Object.keys(bySlot).map(Number).sort((a, b) => a - b).map((t) => {
      const past = NOW_ET >= t;
      const sts = bySlot[t].sort();
      const nSeats = isSenate ? sts.length : sts.reduce((s, st) => s + (hByState[st] || []).length, 0);
      return {
        time: closeParis(t),
        timeColor: past ? '#141414' : '#8c8a85',
        lineStyle: 'height: 2px; border-radius: 999px; background: ' + (past ? '#141414' : '#e4e2de') + ';',
        n: isSenate ? nSeats + ' course' + (nSeats > 1 ? 's' : '') : nSeats + ' siège' + (nSeats > 1 ? 's' : ''),
        chips: sts.map((st) => {
          if (isSenate) {
            const f = sFill(st), pend = f === PENDING;
            return { t: st, gain: sGain(st), dot: sTxt(st), pick: pickSel('S:' + st), aria: NAMES[st] + ', ' + statusText(sRes[st], HOURS[st][2]),
              style: 'background: ' + (pend ? '#ffffff' : f) + '; color: ' + sTxt(st) + '; box-shadow: inset 0 0 0 1px ' + (pend ? '#cfccc6' : 'transparent') + (sel === 'S:' + st ? ', 0 0 0 2px #141414' : '') + ';' };
          }
          const ids = hByState[st] || [];
          const dW = ids.filter((id) => hRes[id] && hRes[id].winner === 'D').length, rW = ids.filter((id) => hRes[id] && hRes[id].winner === 'R').length;
          const done = ids.length && dW + rW === ids.length;
          const bg = done ? 'linear-gradient(90deg, ' + SOLID.D + ' ' + (dW / ids.length * 100) + '%, ' + SOLID.R + ' 0)' : (dW + rW ? 'linear-gradient(90deg, ' + TINT.D + ' ' + (dW / ids.length * 100) + '%, #ffffff 0, #ffffff ' + (100 - rW / ids.length * 100) + '%, ' + TINT.R + ' 0)' : '#ffffff');
          return { t: st + ' ' + ids.length, gain: false, dot: '#141414', pick: pickSel('HS:' + st), aria: NAMES[st] + ', ' + ids.length + ' circonscriptions',
            style: 'background: ' + bg + '; color: ' + (done ? '#ffffff' : '#141414') + '; box-shadow: inset 0 0 0 1px ' + (done ? 'transparent' : '#cfccc6') + (sel === 'HS:' + st ? ', 0 0 0 2px #141414' : '') + ';' };
        })
      };
    });

    // ---------- Textes ----------
    const before = scenario === 'Avant le scrutin';
    const dCtrl = dTotal >= majD && !before, rCtrl = rTotal >= majR && !dCtrl && !before;
    const live = !!feed || scenario === 'Soirée électorale';
    const updated = feed && feed.updated ? 'Mis à jour ' + feed.updated : (this.state.feedErr ? 'Flux indisponible, nouvel essai…' : before ? 'Premiers résultats le 4 nov. à minuit' : scenario === 'Soirée électorale' ? 'Mis à jour à 07 h 12, heure de Paris' : 'Mis à jour le 5 nov. à 18 h 00');
    const tabStyle = (on) => 'min-height: 40px; padding: 0 18px; border-radius: 999px; font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; ' + (on ? 'background: #141414; color: #ffffff;' : 'color: #3a3936;');
    const thumb = (on, key) => ({
      on, pick: () => this.setState({ chamber: key, sel: null }),
      style: 'width: 116px; display: flex; flex-direction: column; gap: 8px; padding: 8px; border-radius: 10px; box-sizing: border-box; border: 1.5px solid ' + (on ? '#141414' : '#e9e7e3') + '; opacity: ' + (on ? 1 : .62) + ';',
      labelStyle: "font-family:'GC National','Helvetica Neue',sans-serif;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;text-align:center;color:" + (on ? '#1c1b1c' : '#828282') + ';'
    });

    // ---------- Scénarios ----------
    const SCN = this.scenarios(), si = this.state.scn == null ? 2 : this.state.scn, sc = SCN[si];
    const PLS = this.polls(), CKS = this.cookSenate(), HDS = this.houseData();
    const dLead = (p) => { if (!p) return null; const nr = p.c.filter((c) => c[1] !== 'R'), rr = p.c.filter((c) => c[1] === 'R'); if (!nr.length || !rr.length) return null; return Math.max(...nr.map((c) => c[2])) - Math.max(...rr.map((c) => c[2])); };
    // Sénat : 34 sièges démocrates hors scrutin + sièges classés côté démocrate, puis courses indécises dans l’ordre des sondages
    const sBase = 34 + Object.keys(CKS).filter((k) => CKS[k] <= 2).length;
    const sOrder = Object.keys(CKS).filter((k) => CKS[k] >= 3).map((k) => ({ k, m: dLead(PLS['S:' + k]) })).filter((o) => o.m != null).sort((a, b) => b.m - a.m);
    const flips = sOrder.slice(0, Math.max(0, sc.sen - sBase)).map((o) => NAMES[o.k]);
    // Chambre : sièges classés côté démocrate, puis indécis selon les sondages, puis tous les indécis, puis les « penche républicain »
    const hIds = Object.keys(HDS);
    const hWin = (lvl) => hIds.filter((id) => { const c = HDS[id][1], m = dLead(PLS['H:' + id]); if (c <= 2) return true; if (c === 3) return lvl >= 3 || (lvl === 2 && m != null && m > 0) || (lvl === 1 && m != null && m >= 4.1); if (c === 4) return lvl >= 4; return false; }).length;
    const hD = hWin(sc.house), sD = sc.sen;
    const fmtR = (d, n) => d + ' – ' + (n - d);
    const LS = this.hemiLayout(100, 5, sD, 51, 400, 30), LH = this.hemiLayout(435, 10, hD, 218, 400, 30);

ible;"><text x="200" y="11" text-anchor="middle" style="font-family: \'GC National\', \'Helvetica Neue\', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;" fill="#1c1b1c">Majorité : 218 sièges</text><path d="' + esc(v.blockH) + '" fill="#ffffff" stroke="#1c1b1c" stroke-width="0.9" stroke-linejoin="round"></path>' + v.dotsH.map((d) => '<circle cx="' + esc(d.cx) + '" cy="' + esc(d.cy) + '" r="' + esc(d.r) + '" fill="' + esc(d.fill) + '"></circle>').join('') + '<text x="200" y="212" text-anchor="middle" style="font-family: \'GC Sanomat\', Georgia, serif; font-weight: 600; font-size: 30px; font-variant-numeric: lining-nums tabular-nums;"><tspan fill="#3b8ee6">' + esc(v.scn.hD) + '</tspan><tspan fill="#b9b6b0"> – </tspan><tspan fill="#e85462">' + esc(v.scn.hR) + '</tspan></text><text x="200" y="233" text-anchor="middle" style="font-family: \'GC National\', \'Helvetica Neue\', sans-serif; font-size: 13px; font-weight: 600;" fill="' + esc(v.scn.hCtlColor) + '">' + esc(v.scn.hCtl) + '</text></svg></figure></div><p style="margin: 0; max-width: 90ch; font-family: \'GC National\', \'Helvetica Neue\', sans-serif; font-size: 12.5px; line-height: 1.55; color: #828282;">Scénarios : Nate Cohn, The New York Times, 29 octobre 2026. Les courses indécises sont attribuées dans l’ordre des moyennes Silver Bulletin. Chambre : calcul Le Grand Continent à partir des classements Cook.</p></section>'
